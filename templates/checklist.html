<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --color-key-50: #e8f1fe;
      --color-key-100: #d9e6ff;
      --color-key-200: #c5d7fb;
      --color-key-900: #0017c1;
      --color-key-1000: #00118f;
      --color-key-1200: #000060;
      --color-success-50: #e6f5ec;
      --color-success-700: #1d8b56;
      --color-danger-800: #ec0000;
      --color-neutral-white: #ffffff;
      --color-neutral-gray-50: #f2f2f2;
      --color-neutral-gray-100: #e6e6e6;
      --color-neutral-gray-200: #cccccc;
      --color-neutral-gray-600: #666666;
      --color-neutral-gray-900: #1a1a1a;
      --color-focus: #ffd43d;
      --font-family-sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    html { font-family: var(--font-family-sans); }
    body { margin: 0; background: var(--color-neutral-white); color: var(--color-neutral-gray-900); line-height: 1.7; }
    button, input, select { font: inherit; }
    a { color: var(--color-key-1000); text-decoration: underline; text-decoration-thickness: 0.0625rem; text-underline-offset: 0.1875rem; }
    a:visited { color: #5109ad; }
    a:hover { color: var(--color-key-900); text-decoration-thickness: 0.1875rem; }
    :focus-visible { outline: 0.25rem solid #000; outline-offset: 0.125rem; border-radius: 0.25rem; box-shadow: 0 0 0 0.125rem var(--color-focus); }
    code { padding: 0.125rem 0.375rem; border: 1px solid var(--color-neutral-gray-200); border-radius: 0.25rem; background: var(--color-neutral-gray-50); overflow-wrap: anywhere; }
    .page { width: min(1500px, calc(100% - 4rem)); margin: 2rem auto 5rem; }
    .toolbar { position: sticky; top: 0; z-index: 20; margin-bottom: 2rem; padding: 1.5rem; border-top: 0.5rem solid var(--color-key-900); border-bottom: 1px solid var(--color-neutral-gray-200); background: var(--color-neutral-white); }
    .toolbar-top, .toolbar-controls, .progress-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    .toolbar-top { justify-content: space-between; }
    .toolbar-title { margin: 0.5rem 0 0; font-size: 1.25rem; line-height: 1.6; }
    .toolbar-controls, .progress-grid { margin-top: 1.25rem; }
    .home-link { font-weight: 700; white-space: nowrap; }
    .button-group { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .button { display: inline-flex; min-width: 6rem; min-height: 3rem; align-items: center; justify-content: center; padding: 0.5rem 1rem; border: 1px solid currentcolor; border-radius: 0.5rem; background: var(--color-neutral-white); color: var(--color-key-900); cursor: pointer; font-weight: 700; letter-spacing: 0.02em; text-align: center; text-decoration: none; }
    .button:hover { background: var(--color-key-200); color: var(--color-key-1000); text-decoration: underline; text-decoration-thickness: 0.0625rem; }
    .button:active { background: var(--color-key-100); color: var(--color-key-1200); }
    .button.danger { color: var(--color-danger-800); }
    .control { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
    .control.is-hidden { display: none; }
    .control input[type="search"], .control select { min-height: 3rem; padding: 0.5rem 0.75rem; border: 1px solid var(--color-neutral-gray-600); border-radius: 0.5rem; background: var(--color-neutral-white); color: var(--color-neutral-gray-900); font-weight: 400; }
    .control input[type="search"] { width: min(32rem, 55vw); }
    progress { width: min(34rem, 65vw); height: 1rem; accent-color: var(--color-key-900); }
    main { padding: clamp(1.5rem, 3vw, 2.5rem); border-top: 0.25rem solid var(--color-key-900); }
    h1, h2, h3, h4 { color: var(--color-neutral-gray-900); font-weight: 700; }
    h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 2.8125rem); line-height: 1.4; letter-spacing: 0.01em; }
    h2, h3, h4 { scroll-margin-top: 14rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--color-neutral-gray-200); }
    h2 { margin-top: 2.5rem; font-size: 1.625rem; line-height: 1.5; letter-spacing: 0.02em; }
    h3 { margin-top: 2rem; font-size: 1.375rem; line-height: 1.5; letter-spacing: 0.02em; }
    h4 { margin-top: 1.5rem; font-size: 1.125rem; line-height: 1.6; border-bottom-style: dashed; }
    .section-toggle {
      float: right;
      margin-left: 0.75rem;
      border: 0;
      background: transparent;
      color: var(--color-key-1000);
      cursor: pointer;
      font-weight: 700;
    }
    .table-wrap {
      width: 100%;
      margin: 1rem 0 2rem;
      overflow-x: auto;
      border: 1px solid var(--color-neutral-gray-200);
      border-radius: 0.5rem;
    }
    table {
      width: 100%;
      min-width: 760px;
      table-layout: fixed;
      border-collapse: collapse;
      background: var(--color-neutral-white);
    }
    th, td {
      box-sizing: border-box;
      padding: 0.875rem 1rem;
      border-right: 1px solid var(--color-neutral-gray-200);
      border-bottom: 1px solid var(--color-neutral-gray-200);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    th {
      position: static;
      top: auto;
      z-index: auto;
      background: var(--color-neutral-gray-50);
      white-space: nowrap;
    }
    col.col-number { width: 7.5rem; }
    col.col-requirement { width: 6rem; }
    .columns-3 col.col-item { width: 31%; }
    .columns-4 col.col-item { width: 28%; }
    .col-number, .col-requirement { white-space: nowrap; }
    .col-item, .col-detail { min-width: 0; }
    thead th {
      vertical-align: top;
      padding: 0.875rem 1rem;
    }
    thead th.col-item { white-space: normal; }
    tbody tr { transition: background-color 120ms ease, opacity 120ms ease; }
    tbody tr:hover { background: var(--color-key-50); }
    tbody tr.is-done {
      background: var(--color-success-50);
      box-shadow: inset 0.25rem 0 0 var(--color-success-700);
    }
    tbody tr.is-hidden { display: none; }
    .check-control {
      display: grid;
      grid-template-columns: 1.45rem minmax(14rem, 1fr);
      gap: 0.55rem;
      align-items: start;
      cursor: pointer;
    }
    .row-check {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .check-mark {
      display: inline-grid;
      place-items: center;
      width: 1.25rem;
      height: 1.25rem;
      margin-top: 0.1rem;
      border: 2px solid var(--color-neutral-gray-600);
      border-radius: 0.25rem;
      background: var(--color-neutral-white);
    }
    .row-check:focus-visible + .check-mark {
      outline: 0.25rem solid #000;
      outline-offset: 0.125rem;
      box-shadow: 0 0 0 0.125rem var(--color-focus);
    }
    .row-check:checked + .check-mark {
      border-color: var(--color-success-700);
      background: var(--color-success-700);
    }
    .row-check:checked + .check-mark::after {
      content: "✓";
      color: #ffffff;
      font-weight: 800;
      line-height: 1;
    }
    .cell-content { min-width: 0; }
    .no-results {
      display: none;
      margin: 1rem 0;
      padding: 1rem;
      border: 1px dashed var(--color-neutral-gray-600);
      border-radius: 0.5rem;
      color: var(--color-neutral-gray-600);
      text-align: center;
    }
    .no-results.is-visible { display: block; }
    .meta {
      color: var(--color-neutral-gray-600);
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }
    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 760px) {
      .page { width: min(100% - 2rem, 1500px); margin-top: 1rem; }
      .toolbar { position: static; }
      th { position: static; }
      main { padding: 1.25rem 0; }
      .control { width: 100%; align-items: stretch; flex-direction: column; }
      .control input[type="search"], .control select { width: 100%; }
      progress { width: 100%; }
      .button-group { display: grid; grid-template-columns: 1fr; width: 100%; }
      .button { width: 100%; }
    }
    @media print {
      :root { color-scheme: light; }
      body { background: #fff; color: #000; }
      .page { width: 100%; margin: 0; }
      .toolbar, .meta, .section-toggle, .no-results { display: none !important; }
      main { border: 0; padding: 0; }
      .table-wrap { overflow: visible; break-inside: avoid; }
      table { min-width: 0; font-size: 9pt; }
      th { position: static; background: #eee; }
      tbody tr.is-hidden { display: table-row; }
      a { color: #000; text-decoration: none; }
    }
  </style>
</head>
<body data-document-id="{{DOCUMENT_ID}}">
  <div class="page">
    <section class="toolbar" aria-label="チェックリスト操作">
      <div class="toolbar-top">
        <div>
          <a class="home-link" href="./index.html">Home</a>
          <h2 class="toolbar-title">チェック状況</h2>
        </div>
        <div class="button-group">
          <button class="button" id="exportButton" type="button">結果を保存</button>
          <button class="button" id="importButton" type="button">結果を読み込み</button>
          <button class="button" id="printButton" type="button">印刷</button>
          <button class="button danger" id="resetButton" type="button">リセット</button>
          <input id="importFile" class="screen-reader-only" type="file" accept="application/json,json">
        </div>
      </div>
      <div class="toolbar-controls">
        <label class="control">
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="項番、項目、詳細を検索">
        </label>
        <label class="control">
          <span>状態</span>
          <select id="statusFilter">
            <option value="all">すべて</option>
            <option value="open">未確認</option>
            <option value="done">確認済み</option>
          </select>
        </label>
        <label class="control {{REQUIREMENT_FILTER_CLASS}}">
          <span>区分</span>
          <select id="requirementFilter">
            <option value="all">すべて</option>
            {{REQUIREMENT_OPTIONS}}
          </select>
        </label>
      </div>
      <div class="progress-grid">
        <span id="progressText">0 / {{ROW_COUNT}} 件</span>
        <progress id="progressBar" value="0" max="{{ROW_COUNT}}">0%</progress>
        <span id="visibleText" aria-live="polite"></span>
      </div>
    </section>

    <main id="checklistContent">
      {{CONTENT}}
      <div id="noResults" class="no-results">条件に一致する項目がありません。</div>
    </main>

    <p class="meta">
      チェック項目: {{ROW_COUNT}}
    </p>
  </div>

  <script>
    (() => {
      "use strict";

      const body = document.body;
      const documentId = body.dataset.documentId;
      const sourceHash = body.dataset.sourceHash;
      const storageKey = `ir-checklist:${documentId}:checks`;
      const rows = Array.from(document.querySelectorAll("tbody tr[data-row-id]"));
      const checkboxes = Array.from(document.querySelectorAll(".row-check"));
      const searchInput = document.getElementById("searchInput");
      const statusFilter = document.getElementById("statusFilter");
      const requirementFilter = document.getElementById("requirementFilter");
      const progressText = document.getElementById("progressText");
      const progressBar = document.getElementById("progressBar");
      const visibleText = document.getElementById("visibleText");
      const noResults = document.getElementById("noResults");
      const importFile = document.getElementById("importFile");

      function normalizeState(value) {
        if (!value || typeof value !== "object") return {};
        if (value.checks && typeof value.checks === "object") return value.checks;
        return value;
      }

      function readState() {
        try {
          return normalizeState(JSON.parse(localStorage.getItem(storageKey) || "{}"));
        } catch (error) {
          console.warn("保存済み状態を読み込めませんでした。", error);
          return {};
        }
      }

      function writeState() {
        const state = {};
        for (const checkbox of checkboxes) {
          if (checkbox.checked) state[checkbox.dataset.itemNumber] = true;
        }
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function applyState(rawState) {
        const state = normalizeState(rawState);
        for (const checkbox of checkboxes) {
          const checked = Boolean(
            state[checkbox.dataset.itemNumber] ?? state[checkbox.dataset.rowId]
          );
          checkbox.checked = checked;
          checkbox.closest("tr").classList.toggle("is-done", checked);
        }
      }

      function normalizedSearch(value) {
        return value.normalize("NFKC").toLocaleLowerCase("ja");
      }

      function applyFilters() {
        const query = normalizedSearch(searchInput.value.trim());
        const status = statusFilter.value;
        const requirement = requirementFilter.value;
        let visible = 0;

        for (const row of rows) {
          const checkbox = row.querySelector(".row-check");
          const searchText = normalizedSearch(row.dataset.search || "");
          const matchesSearch = !query || searchText.includes(query);
          const matchesStatus =
            status === "all" ||
            (status === "done" && checkbox.checked) ||
            (status === "open" && !checkbox.checked);
          const matchesRequirement =
            requirement === "all" || row.dataset.requirement === requirement;
          const show = matchesSearch && matchesStatus && matchesRequirement;
          row.classList.toggle("is-hidden", !show);
          if (show) visible += 1;
        }

        visibleText.textContent = `表示中: ${visible} 件`;
        noResults.classList.toggle("is-visible", visible === 0);
      }

      function updateProgress() {
        const done = checkboxes.filter((checkbox) => checkbox.checked).length;
        const total = checkboxes.length;
        const percent = total ? Math.round((done / total) * 100) : 0;
        progressText.textContent = `${done} / ${total} 件（${percent}%）`;
        progressBar.max = total;
        progressBar.value = done;
        progressBar.textContent = `${percent}%`;
        applyFilters();
      }

      function downloadJson() {
        const checks = {};
        for (const checkbox of checkboxes) {
          checks[checkbox.dataset.itemNumber] = checkbox.checked;
        }
        const payload = {
          format: "ir-checklist-state",
          documentId,
          sourceHash,
          exportedAt: new Date().toISOString(),
          checks,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {
          type: "application/json;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${documentId}-result.json`;
        link.click();
        URL.revokeObjectURL(url);
      }

      async function importJson(file) {
        const payload = JSON.parse(await file.text());
        if (!payload || typeof payload !== "object") {
          throw new Error("JSONの形式が正しくありません。");
        }
        if (payload.documentId && payload.documentId !== documentId) {
          throw new Error("別のチェックリストの結果ファイルです。");
        }
        if (payload.sourceHash && payload.sourceHash !== sourceHash) {
          const proceed = confirm(
            "原稿の版が異なる結果ファイルです。項番が一致する項目だけを読み込みますか？"
          );
          if (!proceed) return;
        }
        const state = normalizeState(payload);
        applyState(state);
        writeState();
        updateProgress();
      }

      for (const checkbox of checkboxes) {
        checkbox.addEventListener("change", () => {
          checkbox.closest("tr").classList.toggle("is-done", checkbox.checked);
          writeState();
          updateProgress();
        });
      }

      searchInput.addEventListener("input", applyFilters);
      statusFilter.addEventListener("change", applyFilters);
      requirementFilter.addEventListener("change", applyFilters);
      document.getElementById("exportButton").addEventListener("click", downloadJson);
      document.getElementById("importButton").addEventListener("click", () => importFile.click());
      document.getElementById("printButton").addEventListener("click", () => window.print());
      document.getElementById("resetButton").addEventListener("click", () => {
        if (!confirm("すべてのチェックを外します。よろしいですか？")) return;
        localStorage.removeItem(storageKey);
        applyState({});
        updateProgress();
      });
      importFile.addEventListener("change", async () => {
        const [file] = importFile.files;
        if (!file) return;
        try {
          await importJson(file);
        } catch (error) {
          alert(error.message || "結果ファイルを読み込めませんでした。");
        } finally {
          importFile.value = "";
        }
      });

      for (const heading of document.querySelectorAll("main h2, main h3, main h4")) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "section-toggle";
        button.textContent = "▲";
        button.setAttribute("aria-expanded", "true");
        heading.appendChild(button);
        button.addEventListener("click", () => {
          const level = Number(heading.tagName.slice(1));
          const collapsed = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", String(!collapsed));
          button.textContent = collapsed ? "▼" : "▲";
          let node = heading.nextElementSibling;
          while (node) {
            if (/^H[1-6]$/.test(node.tagName) && Number(node.tagName.slice(1)) <= level) break;
            node.hidden = collapsed;
            node = node.nextElementSibling;
          }
        });
      }

      applyState(readState());
      updateProgress();
    })();
  </script>
</body>
</html>
